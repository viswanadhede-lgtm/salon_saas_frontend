<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing you in... - BharathBots</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #1e3a8a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 0.5rem; }
        p  { font-size: 0.875rem; color: #64748b; line-height: 1.6; }
        .error-box {
            display: none;
            margin-top: 1.5rem;
            padding: 12px 16px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            color: #b91c1c;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .btn-retry {
            display: none;
            margin-top: 1rem;
            padding: 10px 24px;
            background: #1e3a8a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-retry:hover { background: #1e40af; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" id="spinner"></div>
        <h2 id="statusTitle">Signing you in with Google...</h2>
        <p id="statusMsg">Please wait while we verify your account.</p>
        <div class="error-box" id="errorBox"></div>
        <button class="btn-retry" id="retryBtn" onclick="window.location.href='signin.html'">Back to Sign In</button>
    </div>

    <script type="module">
        import { supabase } from './lib/supabase.js';

        async function handleCallback() {
            try {
                // Supabase automatically picks up the session from the URL hash/fragment
                const { data: { session }, error } = await supabase.auth.getSession();

                if (error || !session) {
                    throw new Error('Could not establish session. Please try again.');
                }

                const user = session.user;
                const token = session.access_token;

                // Store token
                localStorage.setItem('token', token);
                if (session.refresh_token) {
                    localStorage.setItem('refresh_token', session.refresh_token);
                }

                // Store signup_data for the onboarding flow (in case it's a new user)
                const existingSignupData = JSON.parse(localStorage.getItem('signup_data') || '{}');
                if (!existingSignupData.user_id) {
                    const signupData = {
                        user_id: user.id,
                        full_name: user.user_metadata?.full_name || user.user_metadata?.name || '',
                        email: user.email || '',
                        phone: user.user_metadata?.phone || '',
                    };
                    localStorage.setItem('signup_data', JSON.stringify(signupData));
                }

                // Check if user already exists in our users table (existing user)
                const { data: userData } = await supabase
                    .from('users')
                    .select('company_id, branch_id, role_id, status')
                    .eq('user_id', user.id);

                if (userData && userData.length > 0) {
                    // Existing user — set context and go to dashboard
                    const profile = userData[0];

                    if (profile.status === 'deleted' || profile.status === 'inactive') {
                        throw new Error('Your account has been deactivated. Please contact your administrator.');
                    }

                    if (profile.company_id) localStorage.setItem('company_id', profile.company_id);
                    if (profile.branch_id)  localStorage.setItem('active_branch_id', profile.branch_id);
                    if (profile.role_id)    localStorage.setItem('role_id', profile.role_id);

                    // Clear stale caches
                    localStorage.removeItem('userFeatures');
                    localStorage.removeItem('userSubFeatures');
                    localStorage.removeItem('appContext');

                    document.getElementById('statusTitle').textContent = 'Welcome back!';
                    document.getElementById('statusMsg').textContent = 'Redirecting to your dashboard...';

                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);

                } else {
                    // New user — go to plans
                    document.getElementById('statusTitle').textContent = 'Account created!';
                    document.getElementById('statusMsg').textContent = 'Redirecting to plan selection...';

                    setTimeout(() => { window.location.href = 'plans.html'; }, 1000);
                }

            } catch (err) {
                console.error('[auth-callback]', err);
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('statusTitle').textContent = 'Authentication Failed';
                document.getElementById('statusMsg').textContent = '';
                const errorBox = document.getElementById('errorBox');
                errorBox.textContent = err.message || 'Something went wrong. Please try again.';
                errorBox.style.display = 'block';
                document.getElementById('retryBtn').style.display = 'inline-block';
            }
        }

        // Small delay to let Supabase parse the URL hash
        setTimeout(handleCallback, 300);
    </script>
</body>
</html>
