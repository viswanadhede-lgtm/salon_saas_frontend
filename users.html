<!DOCTYPE html>
<html lang="en">

<head>
    <script src="scripts/auth-loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard for BharathBots Salon SaaS.">
    <title>Users - BharathBots</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="submenu.css">
    <link rel="stylesheet" href="styles/global-layout.css">
    <!-- Feather Icons for a clean SaaS look -->
    <script src="https://unpkg.com/feather-icons"></script>
</head>

<body class="dashboard-body">

    <!-- Global Sidebar Shell Placeholder -->
    <div id="global-sidebar"></div>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper" id="mainWrapper">

        <!-- Global Header Shell Placeholder -->
        <div id="global-header"></div>

        <!-- Page Content -->
        <main class="content-area">

            <!-- ===== USERS PAGE ===== -->

            <!-- Page Header -->
            <div class="content-header" style="display: flex; justify-content: space-between; align-items: center;">
                <div class="header-title">
                    <h1>Users</h1>
                    <p class="subtitle">Manage staff accounts and system access</p>
                </div>
                <button class="qa-btn qa-primary" id="btnAddUser" data-sub-feature="user_create">
                    <i data-feather="plus" class="qa-icon"></i>
                    <span>Add User</span>
                </button>
            </div>

            <!-- Users Table -->
            <div style="background:#fff;border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden;">
                <table id="usersTable" style="width:100%;border-collapse:collapse;font-size:0.875rem;">
                    <thead>
                        <tr style="background:#fff;border-bottom:2px solid #e2e8f0;">
                            <th style="padding:14px 16px;text-align:left;font-size:0.72rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;">Name</th>
                            <th style="padding:14px 16px;text-align:left;font-size:0.72rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;">Email</th>
                            <th style="padding:14px 16px;text-align:left;font-size:0.72rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;">Role</th>
                            <th style="padding:14px 16px;text-align:left;font-size:0.72rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;">Branch</th>
                            <th style="padding:14px 16px;text-align:left;font-size:0.72rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;">Status</th>
                            <th style="padding:14px 16px;text-align:left;font-size:0.72rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;">Last Login</th>
                            <th style="padding:14px 16px;text-align:center;font-size:0.72rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>

            <!-- Actions Dropdown -->
            <div id="userActionsDropdown" style="display:none;position:fixed;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:500;min-width:190px;padding:6px;"></div>

            <!-- Add / Edit User Modal -->
            <div class="modal-overlay" id="userModalOverlay">
                <div class="modal-container" id="userModal" style="width:1040px;max-width:95vw;">
                    <div class="modal-header">
                        <div class="header-titles">
                            <h2 id="userModalTitle">Add User</h2>
                            <p class="subtitle" id="userModalSubtitle">Create a new system account.</p>
                        </div>
                        <button class="modal-close" id="closeUserModal"><i data-feather="x"></i></button>
                    </div>
                    <style>
                        #userModal {
                            width: 1040px !important;
                            max-width: 95vw !important;
                            border-radius: 16px !important;
                        }
                        #userModal .modal-header {
                            padding: 1.6rem 2.75rem !important;
                        }
                        #userModal .modal-header h2 {
                            font-size: 1.35rem !important;
                        }
                        #userModal .modal-header .subtitle {
                            font-size: 0.875rem !important;
                        }
                        #userModal .modal-body {
                            padding: 2.25rem 2.75rem !important;
                        }
                        #userModal .modal-body > div {
                            padding: 0 !important;
                        }
                        #userModal .form-group {
                            margin-bottom: 0 !important;
                        }
                        #userModal .form-label {
                            font-size: 0.85rem !important;
                            font-weight: 600 !important;
                            color: #334155 !important;
                            margin-bottom: 6px !important;
                            display: block !important;
                        }
                        #userModal .form-input,
                        #userModal .form-select {
                            height: 46px !important;
                            padding: 10px 14px !important;
                            font-size: 0.925rem !important;
                            border-radius: 10px !important;
                            border: 1.5px solid #e2e8f0 !important;
                            transition: all 0.2s ease !important;
                            background-color: #fff !important;
                            width: 100% !important;
                            box-sizing: border-box !important;
                        }
                        #userModal .form-input:focus,
                        #userModal .form-select:focus {
                            border-color: #8b5cf6 !important;
                            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15) !important;
                            outline: none !important;
                        }
                        #userModal .modal-footer {
                            padding: 1.25rem 2.75rem !important;
                        }
                        #userModal .modal-footer .btn {
                            padding: 11px 24px !important;
                            font-size: 0.925rem !important;
                            font-weight: 600 !important;
                            border-radius: 10px !important;
                            height: 44px !important;
                        }
                    </style>
                    <div class="modal-body" style="overflow-y:auto;">
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:56px;">
                            <div style="display:flex;flex-direction:column;gap:24px;">
                                <p style="font-size:0.75rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:0;">Identity</p>
                                <div class="form-group" style="margin-bottom:0;">
                                    <label class="form-label">Full Name <span class="text-rose">*</span></label>
                                    <input type="text" id="uFullName" class="form-input" placeholder="e.g., Rahul Sharma">
                                </div>
                                <div class="form-group" style="margin-bottom:0;">
                                    <label class="form-label">Email Address <span class="text-rose">*</span></label>
                                    <input type="email" id="uEmail" class="form-input" placeholder="e.g., rahul@salon.com">
                                </div>
                                <div class="form-group" style="margin-bottom:0;">
                                    <label class="form-label">Phone Number <span class="text-muted">(Optional)</span></label>
                                    <input type="tel" id="uPhone" class="form-input" placeholder="+91 0000 000000">
                                </div>
                                <div class="form-group" style="margin-bottom:0;">
                                    <label class="form-label" id="uPasswordLabel">Create Password <span class="text-rose">*</span></label>
                                    <div style="position:relative;display:flex;align-items:center;">
                                        <input type="password" id="uPassword" class="form-input" placeholder="Min 6 characters" style="padding-right:44px;">
                                        <button type="button" id="togglePasswordVisibility" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#64748b;display:flex;align-items:center;justify-content:center;padding:6px;border-radius:6px;transition:color .2s;" title="Show/Hide Password">
                                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div style="display:flex;flex-direction:column;gap:24px;">
                                <p style="font-size:0.75rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:0;">Access Control</p>
                                <div class="form-group" style="margin-bottom:0;">
                                    <label class="form-label">Role <span class="text-rose">*</span></label>
                                    <select id="uRole" class="form-select">
                                        <option value="" disabled selected>Select a role</option>
                                        <option value="Owner" disabled>Owner (Protected)</option>
                                        <option value="Admin">Admin</option>
                                        <option value="Manager">Manager</option>
                                        <option value="Receptionist">Receptionist</option>
                                        <option value="Staff">Staff</option>
                                    </select>
                                </div>
                                <div class="form-group" style="margin-bottom:0;">
                                    <label class="form-label">Branch <span class="text-rose">*</span></label>
                                    <select id="uBranch" class="form-select">
                                        <option value="" disabled selected>Select a branch</option>
                                        <option value="All Branches">All Branches</option>
                                        <option value="Downtown">Downtown</option>
                                        <option value="Whitefield">Whitefield</option>
                                        <option value="Airport Road">Airport Road</option>
                                    </select>
                                </div>
                                <div class="form-group" style="margin-bottom:0;">
                                    <label class="form-label">Account Status</label>
                                    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;margin-top:2px;">
                                        <div>
                                            <p style="margin:0;font-size:0.95rem;font-weight:600;color:#1e293b;">Active Account</p>
                                            <p style="margin:3px 0 0;font-size:0.8rem;color:#64748b;">User can log in and use the system.</p>
                                        </div>
                                        <label class="switch"><input type="checkbox" id="uStatus" checked><span class="slider round"></span></label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="btnCancelUser">Cancel</button>
                        <button type="button" class="btn btn-primary" id="btnSaveUser">Create User</button>
                    </div>
                </div>
            </div>



        </main>
    </div>

    <script type="module" src="scripts/app-shell.js"></script>
    <script type="module" src="users.js?v=2"></script>
    <script type="module" src="scripts/sub-features/sub-feature-gate.js"></script>
    <script>
        // Init Feather Icons
        feather.replace();

        // -- Stat Card Double-Click ------------------------------------------
        function onStatCardDblClick(card, label) {
            if (label === "Today's Bookings") {
                window.location.href = 'todays-bookings.html';
            } else if (label === "Completed Appointments Today") {
                window.location.href = 'completed-appointments.html';
            } else if (label === "No-shows & Cancellations") {
                window.location.href = 'no-shows-cancellations.html';
            } else if (label === "Today's Revenue") {
                window.location.href = 'todays-revenue.html';
            } else {
                console.log("Stat card double clicked: " + label);
            }
        }



    </script>


    <!-- Toast Notification -->
    <div id="toastNotification" class="toast-notification">Booking created successfully (demo)</div>


    <!-- Global Bookings Actions Dropdown -->
    <div id="bkGlobalDropdown" class="bk-dropdown" style="position: fixed; display: none;"></div>


<script src="logout.js"></script><script src="change-password.js"></script>    <script type="module" src="scripts/global-auth-guard.js"></script>
    <script type="module" src="scripts/sub-features/sub-feature-gate.js"></script>
</body>
</html>
