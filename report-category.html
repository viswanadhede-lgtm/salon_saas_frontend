<!DOCTYPE html>
<html lang="en">

<head>
    <script src="scripts/auth-loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Report Category - BharathBots Salon SaaS.">
    <title>Report Category - BharathBots</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="submenu.css">
    <link rel="stylesheet" href="styles/global-layout.css">
    <link rel="stylesheet" href="reports.css">
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            transition: color 0.2s ease;
            font-weight: 500;
        }
        .back-link:hover {
            color: #6366f1;
            text-decoration: none;
        }
        .back-link i {
            width: 14px;
            height: 14px;
        }
    </style>
</head>

<body class="dashboard-body">

    <!-- Global Sidebar Shell Placeholder -->
    <div id="global-sidebar"></div>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper" id="mainWrapper">

        <!-- Global Header Shell Placeholder -->
        <div id="global-header"></div>

        <main class="content-area">
            <!-- Back Link -->
            <a href="reports.html" class="back-link" id="backLink">
                <i data-feather="arrow-left"></i>
                Back to Report Library
            </a>

            <!-- Category Header Banner (populated by JS) -->
            <div class="category-header-banner" id="categoryBanner">
                <div class="category-banner-icon" id="bannerIcon">
                    <i data-feather="bar-chart-2"></i>
                </div>
                <div class="category-banner-text">
                    <h2 id="bannerTitle">Loading...</h2>
                    <p id="bannerSubtitle">Select a sub-report to view detailed analytics</p>
                </div>
            </div>

            <!-- Sub-reports grid (populated by JS) -->
            <div class="sub-reports-grid" id="subReportsGrid">
                <!-- Injected by report-category.js -->
            </div>
        </main>
    </div>

    <!-- ===== GLOBAL MODALS (copied from reports.html) ===== -->
    <!-- New Booking Modal -->
    <div class="modal-overlay" id="bookingModalOverlay">
        <div class="modal-container" id="bookingModal">
            <div class="modal-header">
                <div class="header-titles">
                    <h2>New Booking</h2>
                    <p class="subtitle">Create a new appointment for a customer.</p>
                </div>
                <button class="modal-close" id="closeBookingModal"><i data-feather="x"></i></button>
            </div>
            <div class="modal-body" style="padding: 1.5rem; overflow-y: auto;">
                <div class="modal-form-side" style="width: 100%; max-width: none; flex: 1; padding: 0; border: none;">
                    <div style="width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 32px;">
                        <div style="display: flex; flex-direction: column;">
                            <div class="form-group relative">
                                <label class="form-label" for="phoneSearch">Phone Number <span class="text-rose">*</span></label>
                                <input type="tel" id="phoneSearch" class="form-input" placeholder="Enter phone number" autocomplete="off">
                                <div class="search-suggestions" id="searchSuggestions"></div>
                            </div>
                            <div class="customer-badge-container" id="customerBadgeContainer" style="display:none; margin-bottom: 8px;">
                                <span class="badge-pill existing-badge" id="customerBadge">Existing Customer</span>
                            </div>
                            <div class="form-group span-full" id="newCustomerBadgeContainer" style="display:none; margin-bottom: 8px;">
                                <span class="badge-pill new-badge" id="newCustomerBadge">New Customer</span>
                            </div>
                            <div class="form-group" id="customerNameGroup">
                                <label class="form-label" for="customerName">Customer Name <span class="text-rose">*</span></label>
                                <input type="text" id="customerName" class="form-input" placeholder="Enter customer name">
                            </div>
                            <div class="form-group" id="customerEmailGroup">
                                <label class="form-label" for="customerEmail">Email <span id="emailOptionalLabel" class="text-muted"></span></label>
                                <input type="email" id="customerEmail" class="form-input" placeholder="Enter email address">
                            </div>
                            <div class="form-group section-gap flex-grow" style="margin-bottom: 1.5rem;">
                                <label class="form-label" for="bookingNotes">Booking Notes <span class="text-muted">(Optional)</span></label>
                                <textarea id="bookingNotes" class="form-input form-textarea" placeholder="Add optional notes for this booking..." style="min-height: 120px;"></textarea>
                            </div>
                        </div>
                        <div style="display: flex; flex-direction: column;">
                            <div class="form-group" style="margin-top: 0;">
                                <label class="form-label" for="bookingService">Service <span class="text-rose">*</span></label>
                                <select id="bookingService" class="form-select">
                                    <option value="" disabled selected>Select a service</option>
                                </select>
                            </div>
                            <div class="form-grid" id="serviceMetaFields" style="display:none;">
                                <div class="form-group">
                                    <label class="form-label">Duration</label>
                                    <input type="text" class="form-input read-only-input" id="roDuration" readonly>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Price</label>
                                    <input type="text" class="form-input read-only-input" id="roPrice" readonly>
                                </div>
                            </div>
                            <div class="form-group section-gap">
                                <label class="form-label" for="bookingStaff">Staff <span class="text-rose">*</span></label>
                                <select id="bookingStaff" class="form-select">
                                    <option value="" disabled selected>Select staff member</option>
                                </select>
                            </div>
                            <div class="form-grid section-gap">
                                <div class="form-group">
                                    <label class="form-label" for="bookingDate">Date <span class="text-rose">*</span></label>
                                    <input type="date" id="bookingDate" class="form-input">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="bookingTime">Time <span class="text-rose">*</span></label>
                                    <div class="relative" style="display: flex; gap: 8px;">
                                        <input type="time" id="bookingTime" class="form-input" style="flex: 1;">
                                        <button type="button" class="btn btn-secondary" id="btnTimeNow" style="padding: 0 12px; height: 40px; font-size: 13px;">Now</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="btnCancelBooking">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnConfirmBooking" disabled>Confirm Booking</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastNotification" class="toast-notification">Booking created successfully (demo)</div>

    <!-- Global Bookings Actions Dropdown -->
    <div id="bkGlobalDropdown" class="bk-dropdown" style="position: fixed; display: none;"></div>

    <script type="module" src="scripts/app-shell.js"></script>
    <script>
        feather.replace();
    </script>
    <script type="module" src="scripts/reports/report-category.js"></script>
    <script src="logout.js"></script>
    <script src="change-password.js"></script>
    <script type="module" src="scripts/global-auth-guard.js"></script>
    <script type="module" src="scripts/sub-features/sub-feature-gate.js"></script>
</body>

</html>
