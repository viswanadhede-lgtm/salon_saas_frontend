<!DOCTYPE html>
<html lang="en">

<head>
    <script src="scripts/auth-loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Report Category - BharathBots Salon SaaS.">
    <title>Report Category - BharathBots</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="submenu.css">
    <link rel="stylesheet" href="styles/global-layout.css">
    <link rel="stylesheet" href="reports.css">
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            transition: color 0.2s ease;
            font-weight: 500;
        }
        .back-link:hover {
            color: #6366f1;
            text-decoration: none;
        }
        .back-link i {
            width: 14px;
            height: 14px;
        }
    </style>
</head>

<body class="dashboard-body">

    <!-- Global Sidebar Shell Placeholder -->
    <div id="global-sidebar"></div>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper" id="mainWrapper">

        <!-- Global Header Shell Placeholder -->
        <div id="global-header"></div>

        <main class="content-area">
            <!-- Back Link -->
            <a href="reports.html" class="back-link" id="backLink">
                <i data-feather="arrow-left"></i>
                Back to Report Library
            </a>

            <!-- Category Overview Card (matches Screenshot 1) -->
            <div class="category-overview-card" id="categoryContainer">
                <div class="category-overview-header">
                    <h1 id="bannerTitle">Bookings Reports</h1>
                    <p id="bannerSubtitle">Booking outcomes and their financial impact.</p>
                </div>

                <!-- 4 Top Stat Cards Row -->
                <div class="category-stat-cards" id="categoryStatCardsRow" style="display: none;">
                    <!-- Injected dynamically by report-category.js -->
                </div>

                <div class="mockup-note" id="mockupNote" style="display: none;">
                    Design mockup only. Values are placeholders, not live data.
                </div>

                <!-- Sub-reports Section Title -->
                <div class="reports-section-title" id="subReportsSectionTitle">Booking Reports</div>

                <!-- Sub-reports grid -->
                <div class="sub-reports-grid-2x2" id="subReportsGrid">
                    <!-- Injected by report-category.js -->
                </div>
            </div>
        </main>
    </div>

    <!-- ===== GLOBAL MODALS (copied from reports.html) ===== -->


    <!-- Toast Notification -->
    <div id="toastNotification" class="toast-notification">Booking created successfully (demo)</div>

    <!-- Global Bookings Actions Dropdown -->
    <div id="bkGlobalDropdown" class="bk-dropdown" style="position: fixed; display: none;"></div>

    <script type="module" src="scripts/app-shell.js"></script>
    <script>
        feather.replace();
    </script>
    <script type="module" src="scripts/reports/report-category.js"></script>
    <script src="logout.js"></script>
    <script src="change-password.js"></script>
    <script type="module" src="scripts/global-auth-guard.js"></script>
    <script type="module" src="scripts/sub-features/sub-feature-gate.js"></script>
</body>

</html>
