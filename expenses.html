<!DOCTYPE html>
<html lang="en">

<head>
    <script src="scripts/auth-loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard for BharathBots Salon SaaS.">
    <title>Analytics Overview - BharathBots</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="submenu.css">
    <link rel="stylesheet" href="styles/global-layout.css">
    <!-- Feather Icons for a clean SaaS look -->
    <script src="https://unpkg.com/feather-icons"></script>
    <!-- Chart.js for beautiful analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        /* Advanced Infographic Styles */
        .infographic-container {
            display: grid;
            grid-template-columns: 180px 1fr 200px;
            gap: 20px;
            align-items: center;
            height: 300px;
            padding: 10px 0;
        }

        .primary-insight {
            text-align: left;
            padding: 20px;
            border-right: 1px solid #f1f5f9;
        }

        .primary-value {
            font-size: 3rem;
            font-weight: 800;
            color: #1e293b;
            line-height: 1;
            margin-bottom: 8px;
        }

        .primary-label {
            font-size: 0.875rem;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .chart-hub {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .result-center {
            position: absolute;
            width: 70px;
            height: 70px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 4px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border: 4px solid #f8fafc;
            transform: translateZ(20px);
        }

        .result-title {
            font-size: 0.65rem;
            font-weight: 800;
            color: #1e293b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1px;
        }

        .result-subtitle {
            font-size: 0.5rem;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .metric-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .metric-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .metric-icon-wrap {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .metric-info h4 {
            font-size: 0.85rem;
            font-weight: 600;
            margin: 0;
            color: #1e293b;
        }

        .metric-info p {
            font-size: 0.75rem;
            color: #64748b;
            margin: 0;
        }

        .connector-line {
            height: 1px;
            background: #e2e8f0;
            flex: 1;
            margin: 0 8px;
        }

        /* Modern Glassmorphism Hover Card */
        #customChartTooltip {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(8px) saturate(160%);
            -webkit-backdrop-filter: blur(8px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.02);
            padding: 10px 14px;
            z-index: 9999;
            transition: opacity 0.15s ease;
            min-width: 130px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            /* Static position anchor - far RHS and all the way up */
            right: -110px;
            top: -100px;
        }

        #connectorLineSvg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            overflow: visible; /* Ensure line can reach outside hub bounds */
        }

        .tooltip-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tooltip-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .tooltip-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
        }

        .tooltip-body {
            display: flex;
            flex-direction: column;
        }

        .tooltip-value {
            font-size: 1rem;
            font-weight: 800;
            color: #1e293b;
        }

        .tooltip-trend {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #10b981;
            margin-top: 1px;
        }

        /* Toggle Switch Styles */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .toggle-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 28px;
            height: 16px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #e2e8f0;
            transition: .3s;
            border-radius: 16px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #6366f1;
        }

        input:checked + .slider:before {
            transform: translateX(12px);
        }
    </style>


    <!-- Expenses Specific CSS -->
    <style>
        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .data-table th {
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1rem 1.5rem;
            border-bottom: 2px solid #e2e8f0;
            background-color: #f8fafc;
            white-space: nowrap;
        }

        .data-table td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
            color: #1e293b;
            font-size: 0.875rem;
        }

        .data-table tbody tr:hover {
            background-color: #f8fafc;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem 0.625rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .filter-select {
            padding: 0 32px 0 36px !important;
            height: 42px !important;
            border-radius: 8px !important;
            font-size: 0.875rem !important;
            border: 1px solid #e2e8f0 !important;
            background-color: #fff !important;
            color: #334155 !important;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23475569%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat, repeat;
            background-position: right .7em top 50%, 0 0;
            background-size: .65em auto, 100%;
            min-width: 140px;
        }

        .expenses-actions-wrap {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .table-controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1.5rem;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>

<body class="dashboard-body" style="min-height: calc(100vh / 0.93);">

    <!-- Global Sidebar Shell Placeholder -->
    <div id="global-sidebar"></div>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper" id="mainWrapper">

        <!-- Global Header Shell Placeholder -->
        <div id="global-header"></div>

        <!-- Page Content -->
                <main class="content-area">
            <div class="content-header" style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem;">
                <div>
                    <h1>Expenses</h1>
                    <p class="text-muted">Manage and track your business expenses</p>
                </div>
                <div class="content-actions" style="display: flex; gap: 12px; align-items: center;">
                    <!-- Advanced Date Filter Modal Wrapper -->
                    <div style="position:relative;">
                        <button id="exDateBtn" style="background-image:none !important; min-height:42px; display:flex; align-items:center; gap:6px; padding:0 12px 0 16px; background-color:#fff; border:1px solid #e2e8f0; border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,0.05); color:#334155; font-size:0.875rem; min-width:160px; justify-content:space-between; cursor:pointer;"
                            onclick="event.stopPropagation(); var m=document.getElementById('exDateMenu'); m.style.display=(m.style.display==='block'?'none':'block');">
                            <span style="display:flex; align-items:center; gap:6px;">
                                <i data-feather="calendar" style="width:14px; height:14px; color:#64748b; flex-shrink:0;"></i>
                                <span id="exDateLabel" style="display:flex; align-items:center; gap:6px; white-space:nowrap;">This Month</span>
                            </span>
                            <i data-feather="chevron-down" style="width:14px; height:14px; color:#64748b; flex-shrink:0;"></i>
                        </button>
                        <div id="exDateMenu" style="display:none; position:absolute; top:48px; right:0; width:320px; background:#fff; border:1px solid #e2e8f0; border-radius:10px; box-shadow:0 8px 24px rgba(15,23,42,0.1); padding:6px 0; z-index:9999;">
                            <button onclick="event.stopPropagation(); window.setExpensesDateFilter('this_month');"
                                style="width:100%; padding:9px 16px; text-align:left; border:none; background:none; font-size:0.85rem; color:#374151; cursor:pointer;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='none'">This Month</button>
                            <button onclick="event.stopPropagation(); window.setExpensesDateFilter('last_month');"
                                style="width:100%; padding:9px 16px; text-align:left; border:none; background:none; font-size:0.85rem; color:#374151; cursor:pointer;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='none'">Last Month</button>
                            <button onclick="event.stopPropagation(); window.setExpensesDateFilter('3months');"
                                style="width:100%; padding:9px 16px; text-align:left; border:none; background:none; font-size:0.85rem; color:#374151; cursor:pointer;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='none'">Last 3 Months</button>
                            <button onclick="event.stopPropagation(); window.setExpensesDateFilter('6months');"
                                style="width:100%; padding:9px 16px; text-align:left; border:none; background:none; font-size:0.85rem; color:#374151; cursor:pointer;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='none'">Last 6 Months</button>
                            <button onclick="event.stopPropagation(); window.setExpensesDateFilter('12months');"
                                style="width:100%; padding:9px 16px; text-align:left; border:none; background:none; font-size:0.85rem; color:#374151; cursor:pointer;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='none'">Last 12 Months</button>
                            <button onclick="event.stopPropagation(); window.setExpensesDateFilter('all');"
                                style="width:100%; padding:9px 16px; text-align:left; border:none; background:none; font-size:0.85rem; color:#374151; cursor:pointer;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='none'">All Time</button>
                            
                            <button onclick="event.stopPropagation(); var p=document.getElementById('exCustomRange'); p.style.display=p.style.display==='none'?'block':'none';"
                                style="width:100%; padding:9px 16px; text-align:left; border:none; background:none; font-size:0.85rem; color:#374151; cursor:pointer; border-top:1px solid #f1f5f9;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='none'">Custom Range...</button>
                            <div id="exCustomRange" style="display:none; padding:12px 14px; border-top:1px solid #f1f5f9;">
                                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
                                    <div>
                                        <label style="font-size:0.72rem; color:#64748b; font-weight:600; display:block; margin-bottom:4px;">From</label>
                                        <input type="date" id="expensesCustomStart" style="width:100%; border:1px solid #e2e8f0; border-radius:6px; padding:5px 6px; font-size:0.78rem; outline:none; box-sizing:border-box;">
                                    </div>
                                    <div>
                                        <label style="font-size:0.72rem; color:#64748b; font-weight:600; display:block; margin-bottom:4px;">To</label>
                                        <input type="date" id="expensesCustomEnd" style="width:100%; border:1px solid #e2e8f0; border-radius:6px; padding:5px 6px; font-size:0.78rem; outline:none; box-sizing:border-box;">
                                    </div>
                                </div>
                                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                                    <button onclick="event.stopPropagation(); document.getElementById('expensesCustomStart').value=''; document.getElementById('expensesCustomEnd').value=''; window.setExpensesDateFilter('all');"
                                        style="padding:7px 0; background:#f8fafc; color:#64748b; border:1px solid #e2e8f0; border-radius:6px; font-size:0.8rem; font-weight:600; cursor:pointer;">Reset</button>
                                    <button onclick="event.stopPropagation(); window.setExpensesDateFilter('custom');"
                                        style="padding:7px 0; background:#1e3a8a; color:#fff; border:none; border-radius:6px; font-size:0.8rem; font-weight:600; cursor:pointer;">Apply</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Hidden actual select for JS bindings -->
                    <select id="expensesDateRange" style="display:none;">
                        <option value="this_month" selected>This Month</option>
                        <option value="last_month">Last Month</option>
                        <option value="3months">Last 3 Months</option>
                        <option value="6months">Last 6 Months</option>
                        <option value="12months">Last 12 Months</option>
                        <option value="all">All Time</option>
                        <option value="custom">Custom Range</option>
                    </select>
                    <button class="btn btn-primary" onclick="window.openAddExpenseModal()" data-sub-feature="expenses_create" style="display: flex; align-items: center; gap: 8px;">
                        <i data-feather="plus"></i>
                        Add Expense
                    </button>
                </div>
            </div>

            <!-- Summary Cards -->
            <div class="summary-cards" style="margin-bottom: 1.5rem; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem;">
                
                <!-- Static: Ignore Filters -->
                <div class="card stat-card">
                    <div class="stat-icon bg-rose-light">
                        <i data-feather="clock" class="text-rose"></i>
                    </div>
                    <div class="stat-details">
                        <p class="stat-label">Today's Expenses</p>
                        <h3 class="stat-value" id="cardTodayExpenses">?0</h3>
                    </div>
                </div>
                <div class="card stat-card">
                    <div class="stat-icon bg-amber-light">
                        <i data-feather="calendar" class="text-amber"></i>
                    </div>
                    <div class="stat-details">
                        <p class="stat-label">This Month Expenses</p>
                        <h3 class="stat-value" id="cardThisMonthExpenses">?0</h3>
                    </div>
                </div>

                <!-- Dynamic: Respect Filters -->
                <div class="card stat-card">
                    <div class="stat-icon bg-indigo-light">
                        <i data-feather="dollar-sign" class="text-indigo"></i>
                    </div>
                    <div class="stat-details">
                        <p class="stat-label">Total Expenses</p>
                        <h3 class="stat-value" id="cardTotalExpenses">?0</h3>
                    </div>
                </div>
                <div class="card stat-card">
                    <div class="stat-icon bg-blue-light">
                        <i data-feather="bar-chart-2" class="text-blue"></i>
                    </div>
                    <div class="stat-details">
                        <p class="stat-label">Top Expense Category</p>
                        <h3 class="stat-value" id="cardTopCategory" style="line-height: 1.25; margin-top:2px;">-</h3>
                    </div>
                </div>
            </div>

            <!-- Filters & Table -->
            <div class="card" style="padding: 1.5rem;">
                <div style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 1.5rem; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <div style="position: relative;">
                        <i data-feather="filter" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; color: #64748b;"></i>
                        <select id="filterCategory" class="filter-select" style="width: 200px;">
                            <option value="All">All Categories</option>
                            <option value="Rent">Rent</option>
                            <option value="Salary">Salary</option>
                            <option value="Products">Products</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Maintenance">Maintenance</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="table-container">
                    <table class="data-table" id="expensesTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th style="text-align: center; width: 17%;">Notes</th>
                                <th>Added By</th>
                                <th style="text-align: center; width: 21%;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="expensesTableBody">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Expense Modal -->
    <div class="modal-overlay" id="addExpenseModal" onclick="if(event.target === this) window.closeAddExpenseModal();">
        <div class="modal-container" style="max-width: 860px;">
            <div class="modal-header">
                <h2>Add New Expense</h2>
                <button class="icon-btn" onclick="window.closeAddExpenseModal()"><i data-feather="x"></i></button>
            </div>
            <div class="modal-body">
                <form id="addExpenseForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start;">
                        <!-- Left Column -->
                        <div style="display: flex; flex-direction: column; gap: 16px;">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label">Date <span class="required">*</span></label>
                                <input type="date" class="form-input" id="expenseDate" required>
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label">Amount (?) <span class="required">*</span></label>
                                <input type="number" class="form-input" id="expenseAmount" min="0" step="0.01" required>
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label">Category <span class="required">*</span></label>
                                <select class="form-select" id="expenseCategory" required>
                                    <option value="" disabled selected>Select Category</option>
                                    <option value="Rent">Rent</option>
                                    <option value="Salary">Salary</option>
                                    <option value="Products">Products</option>
                                    <option value="Utilities">Utilities</option>
                                    <option value="Maintenance">Maintenance</option>
                                    <option value="Marketing">Marketing</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                        <!-- Right Column -->
                        <div style="display: flex; flex-direction: column; height: 100%;">
                            <div class="form-group" style="margin-bottom: 0; flex: 1; display: flex; flex-direction: column;">
                                <label class="form-label">Notes <span style="color:#94a3b8; font-weight:400;">(Optional)</span></label>
                                <textarea id="expenseNotes" placeholder="Add optional notes for this expense..." style="flex: 1; min-height: 140px; resize: none; width: 100%; padding: 12px 14px; border: 1.5px solid #ddd6fe; border-radius: 10px; font-size: 0.875rem; color: #374151; background: #fff; outline: none; font-family: inherit; line-height: 1.5; box-sizing: border-box; transition: border-color 0.2s;" onfocus="this.style.borderColor='#a78bfa'" onblur="this.style.borderColor='#ddd6fe'"></textarea>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="window.closeAddExpenseModal()">Cancel</button>
                <button class="btn btn-primary" onclick="window.submitExpense()">Save Expense</button>
            </div>
        </div>
    </div>

    <!-- View Expense Notes Modal -->
    <div class="modal-overlay" id="viewExpenseNotesModal" onclick="if(event.target === this) window.closeExpenseNotesModal();">
        <div class="modal-container" style="max-width: 500px;">
            <div class="modal-header">
                <h2>Expense Notes</h2>
                <button class="icon-btn" onclick="window.closeExpenseNotesModal()"><i data-feather="x"></i></button>
            </div>
            <div class="modal-body" style="padding: 1.5rem; padding-bottom: 2rem; white-space: pre-wrap; font-size: 0.95rem; color: #374151; line-height: 1.5;" id="expenseNotesContent">
                <!-- Notes will populate here -->
            </div>
        </div>
    </div>

        <script type="module" src="scripts/app-shell.js"></script>
    <script src="config/feature-registry.js" type="module"></script>
    <script src="scripts/global-auth-guard.js" type="module"></script>
    <script src="scripts/sub-features/sub-feature-gate.js" type="module"></script>
