<!DOCTYPE html>
<html lang="en">

<head>
    <script src="scripts/auth-loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Company Settings - Manage your business information, settings and preferences.">
    <title>Company Settings - BharathBots</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="submenu.css">
    <link rel="stylesheet" href="styles/global-layout.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        /* -- Settings Hub Styles ------------------------------- */
        .settings-hub-header {
            margin-bottom: 32px;
        }
        .settings-hub-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 6px 0;
        }
        .settings-hub-header p {
            font-size: 0.95rem;
            color: #64748b;
            margin: 0;
        }

        .settings-cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            max-width: 1050px;
        }

        @media (max-width: 768px) {
            .settings-cards-grid { grid-template-columns: 1fr; }
        }

        .settings-card,
        .settings-card:link,
        .settings-card:visited {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 28px 24px;
            cursor: pointer;
            text-decoration: none !important;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .settings-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            border: 2px solid transparent;
            transition: border-color 0.22s;
        }
        .settings-card:hover,
        .settings-card:focus,
        .settings-card:active {
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.08);
            transform: translateY(-2px);
            border-color: #cbd5e1;
            text-decoration: none !important;
            color: inherit;
        }
        .settings-card:hover::after {
            border-color: #3b82f6;
        }
        .settings-card.card-branch:hover::after {
            border-color: #0d9488;
        }
        .settings-card *,
        .settings-card:hover * {
            text-decoration: none !important;
        }

        .settings-card-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .settings-card-icon i,
        .settings-card-icon svg {
            width: 22px;
            height: 22px;
        }

        .settings-card-body {
            width: 100%;
        }
        .settings-card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 6px 0;
            letter-spacing: -0.01em;
        }
        .settings-card-desc {
            font-size: 0.9rem;
            color: #64748b;
            margin: 0;
            line-height: 1.5;
            font-weight: 450;
        }

        /* Card accent colors */
        .icon-blue   { background: #eff6ff; color: #2563eb; }
        .icon-teal   { background: #f0fdfa; color: #0d9488; }
        .icon-amber  { background: #fffbeb; color: #f59e0b; }
        .icon-green  { background: #f0fdf4; color: #22c55e; }
        .icon-violet { background: #f5f3ff; color: #8b5cf6; }
        .icon-rose   { background: #fff1f2; color: #f43f5e; }
        .icon-indigo { background: #eef2ff; color: #6366f1; }
        .icon-orange { background: #fff7ed; color: #f97316; }
        .icon-pink   { background: #fdf2f8; color: #ec4899; }
        .icon-sky    { background: #f0f9ff; color: #0ea5e9; }
        .icon-slate  { background: #f8fafc; color: #475569; }
    </style>
</head>

<body class="dashboard-body">

    <!-- Global Sidebar Shell Placeholder -->
    <div id="global-sidebar"></div>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper" id="mainWrapper">

        <!-- Global Header Shell Placeholder -->
        <div id="global-header"></div>

        <!-- Page Content -->
        <main class="content-area">
            <div class="settings-hub-header">
                <h1>Company Settings</h1>
                <p>Manage your business information, settings and preferences</p>
            </div>

            <div class="settings-cards-grid">

                <!-- 1. Company Settings -->
                <a href="settings-company.html" class="settings-card" id="card-company-settings">
                    <div class="settings-card-icon icon-blue">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 21h18"></path>
                            <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"></path>
                            <path d="M9 7h1"></path>
                            <path d="M9 11h1"></path>
                            <path d="M9 15h1"></path>
                            <path d="M14 7h1"></path>
                            <path d="M14 11h1"></path>
                            <path d="M14 15h1"></path>
                        </svg>
                    </div>
                    <div class="settings-card-body">
                        <p class="settings-card-title">Company Settings</p>
                        <p class="settings-card-desc">Business &middot; Contact &middot; Tax</p>
                    </div>
                </a>

                <!-- 2. Branch Settings -->
                <a href="settings-branch.html" class="settings-card card-branch" id="card-branch-settings">
                    <div class="settings-card-icon icon-teal">
                        <i data-feather="map-pin"></i>
                    </div>
                    <div class="settings-card-body">
                        <p class="settings-card-title">Branch Settings</p>
                        <p class="settings-card-desc">Hours &middot; Invoice &middot; Payments &middot; Notifications &middot; Branch Details</p>
                    </div>
                </a>

            </div>
        </main>
    </div>

    <script src="logout.js"></script>
    <script src="change-password.js"></script>
    <script type="module" src="scripts/app-shell.js"></script>
    <script type="module" src="scripts/global-auth-guard.js"></script>
    <script type="module" src="scripts/sub-features/sub-feature-gate.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof feather !== 'undefined') feather.replace();

            // Sidebar toggle
            const sidebar = document.getElementById('sidebar');
            const mainWrapper = document.getElementById('mainWrapper');
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', () => {
                    sidebar.classList.toggle('collapsed');
                    mainWrapper.classList.toggle('sidebar-collapsed');
                });
            }

            // Submenu toggles
            document.querySelectorAll('.submenu-toggle').forEach(toggle => {
                toggle.addEventListener('click', () => {
                    const li = toggle.closest('.nav-item');
                    li.classList.toggle('open');
                });
            });
            // Auto-open active submenu
            document.querySelectorAll('.nav-item.active').forEach(li => li.classList.add('open'));

            // Profile dropdown
            const avatarBtn = document.getElementById('avatarBtn');
            const profileMenu = document.getElementById('profileMenu');
            const backdrop = document.getElementById('profileBackdrop');
            if (avatarBtn) {
                avatarBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    profileMenu.classList.toggle('show');
                    backdrop.classList.toggle('show');
                });
                backdrop.addEventListener('click', () => {
                    profileMenu.classList.remove('show');
                    backdrop.classList.remove('show');
                });
            }
        });
    </script>
</body>
</html>
