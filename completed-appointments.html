    <style>
        body.ca-page-body { background: #f8fafc; }

        .ca-page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 32px 14px 32px;
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
        }

        .ca-table-area { flex: 1; overflow-y: auto; padding: 0; }

        .main-wrapper { display: flex; flex-direction: column; height: calc(100vh / 0.93); overflow: hidden; }

        /* Table Rows */
        .tb-row { border-bottom: 1px solid #e3ecf5; transition: background 0.15s; }
        .tb-row:nth-child(even) { background: #ffffff; }
        .tb-row:hover { background: #dce9f1f5; }
        
        .highlight-row {
            animation: highlightPulse 2s ease-out;
        }

        @keyframes highlightPulse {
            0% { background-color: #fef08a; }
            50% { background-color: #fef08a; }
            100% { background-color: transparent; }
        }

        /* Status / Payment Pills */
        .tb-status-pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
        .tb-status-booked    { background: #dbeafe; color: #1d4ed8; }
        .tb-status-completed { background: #d1fae5; color: #065f46; }
        .tb-status-noshow    { background: #fee2e2; color: #991b1b; }
        .tb-status-cancelled { background: #fef9c3; color: #92400e; }
        .tb-payment-paid    { background: #d1fae5; color: #065f46; }
        .tb-payment-pending { background: #fef3c7; color: #92400e; }
        .tb-payment-partial { background: #ffe4e6; color: #9f1239; }

        /* Action Button */
        .tb-action-btn {
            display: flex; align-items: center; gap: 6px; padding: 6px 12px;
            border-radius: 7px; border: 1px solid #e2e8f0; background: #fff;
            font-size: 0.8rem; font-weight: 500; color: #374151; cursor: pointer;
            transition: all 0.15s; white-space: nowrap;
        }
        .tb-action-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }

        /* Actions Dropdown */
        .tb-actions-menu {
            position: fixed; background: #fff; border: 1px solid #e2e8f0;
            border-radius: 10px; box-shadow: 0 8px 30px rgba(15,23,42,0.12);
            min-width: 190px; z-index: 800; overflow: hidden; animation: dropIn 0.15s ease;
        }
        @keyframes dropIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

        .tb-menu-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 16px;
            font-size: 0.855rem; font-weight: 500; color: #374151; cursor: pointer;
            transition: background 0.12s; border: none; background: none; width: 100%; text-align: left;
        }
        .tb-menu-item:hover { background: #f8fafc; }
        .tb-menu-item + .tb-menu-item { border-top: 1px solid #f1f5f9; }

        /* Customer Link */
        .customer-link { font-weight: 600; color: #4f46e5; cursor: pointer; text-decoration: none; transition: all 0.2s; }
        .customer-link:hover { color: #4338ca; text-decoration: underline; }

        /* Action Summary Modal */
        .action-summary-overlay {
            display: none; position: fixed; inset: 0; z-index: 900;
            background: rgba(15,23,42,0.45); align-items: center; justify-content: center;
        }
        @keyframes summaryPop {
            from { opacity:0; transform:scale(0.92) translateY(8px); }
            to   { opacity:1; transform:scale(1) translateY(0); }
        }

        /* Toast */
        .tb-toast {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 10px;
            font-size: 0.875rem; font-weight: 500; opacity: 0; transition: all 0.3s ease;
            z-index: 1000; white-space: nowrap;
        }
        .tb-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>

<body class="dashboard-body ca-page-body">

            </div>

    <!-- Action Summary Modal -->
    <div id="actionSummaryOverlay" class="action-summary-overlay">
        <div style="background:#fff; border-radius:16px; box-shadow:0 20px 60px rgba(15,23,42,0.2); width:420px; max-width:90vw; overflow:hidden; animation:summaryPop 0.22s cubic-bezier(0.34,1.56,0.64,1);">
            <div style="padding:20px 24px 16px; border-bottom:1px solid #f1f5f9;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <div id="actionSummaryIcon" style="width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;"></div>
                    <div>
                        <p style="font-size:0.72rem; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:#94a3b8; margin:0 0 2px;" id="actionSummaryActionLabel">Action</p>
                        <h3 style="font-size:1rem; font-weight:700; color:#1e293b; margin:0;" id="actionSummaryTitle">Confirm Action</h3>
                    </div>
                </div>
            </div>
            <div style="padding:18px 24px;">
                <div style="background:#f8fafc; border-radius:10px; padding:14px 16px; margin-bottom:14px;">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px 16px;" id="actionSummaryDetails"></div>
                </div>
                <p id="actionSummaryMessage" style="font-size:0.875rem; color:#475569; margin:0; line-height:1.5;"></p>
            </div>
            <div style="display:flex; gap:10px; padding:0 24px 20px; justify-content:flex-end;">
                <button onclick="closeActionSummary()" style="padding:9px 22px; border-radius:8px; border:1px solid #e2e8f0; background:#fff; font-size:0.875rem; font-weight:500; color:#475569; cursor:pointer;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='#fff'">Cancel</button>
                <button id="actionSummaryConfirm" style="padding:9px 22px; border-radius:8px; border:none; font-size:0.875rem; font-weight:600; color:#fff; cursor:pointer;">Confirm</button>
