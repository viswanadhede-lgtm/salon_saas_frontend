<!DOCTYPE html>
<html lang="en">
<head>
    <script src="scripts/auth-loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Business Hours - Set your regular opening hours for each day of the week.">
    <title>Business Hours - BharathBots</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="submenu.css">
    <link rel="stylesheet" href="styles/global-layout.css">
    <link rel="stylesheet" href="settings-shared.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .hours-row {
            display: grid;
            grid-template-columns: 140px 1fr 1fr 130px;
            align-items: center;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid #f1f5f9;
            transition: opacity 0.2s ease;
        }
        .hours-row:last-child {
            border-bottom: none;
        }
        .hours-row.is-closed {
            opacity: 0.55;
        }
        .hours-row.is-closed select {
            background-color: #f8fafc;
            border-color: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
        }
        .hours-day {
            font-size: 0.92rem;
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hours-toggle-wrap {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
        }
        .hours-status-text {
            font-size: 0.82rem;
            font-weight: 650;
            letter-spacing: 0.02em;
            min-width: 52px;
            text-align: left;
            transition: all 0.2s ease;
        }
        .hours-status-text.status-open {
            color: #16a34a;
        }
        .hours-status-text.status-closed {
            color: #94a3b8;
        }
        @media (max-width: 680px) {
            .hours-row {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .hours-day {
                grid-column: span 1;
            }
            .hours-toggle-wrap {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body class="dashboard-body">

    <!-- Global Sidebar Shell Placeholder -->
    <div id="global-sidebar"></div>

    <div class="main-wrapper" id="mainWrapper">

        <!-- Global Header Shell Placeholder -->
        <div id="global-header"></div>

        <main class="content-area">
            <div class="sp-breadcrumb">
                <a href="company.html" class="sp-back"><i data-feather="arrow-left"></i> Company Settings</a>
                <span class="sp-sep">/</span>
                <span class="sp-current">Hours</span>
            </div>
            <div class="sp-header">
                <h1>Business Hours</h1>
                <p>Set your regular opening hours for each day of the week</p>
            </div>

            <div class="sp-card">
                <div class="sp-card-header">
                    <h2><i data-feather="clock" style="width:18px;height:18px;color:#3b82f6;"></i> Weekly Schedule</h2>
                    <p>Toggle days open/closed and set opening and closing times</p>
                </div>
                <div class="sp-card-body" id="hoursContainer">
                    <!-- Rendered by JS -->
                </div>
                <div class="sp-savebar" id="savebar">
                    <button class="btn btn-secondary" onclick="cancelHours()">Cancel</button>
                    <button class="btn btn-primary" id="btnSave" onclick="saveHours()">
                        <i data-feather="save" style="width:15px;height:15px;"></i> Save Changes
                    </button>
                </div>
            </div>

            <div id="toastNotification" class="sp-toast"></div>
        </main>
    </div>

    <script src="logout.js"></script>
    <script type="module" src="scripts/app-shell.js"></script>
    <script type="module" src="scripts/global-auth-guard.js"></script>
    <script type="module" src="scripts/settings-hours.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof feather !== 'undefined') feather.replace();
            document.getElementById('sidebarToggle')?.addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('collapsed');
                document.getElementById('mainWrapper').classList.toggle('sidebar-collapsed');
            });
            document.querySelectorAll('.submenu-toggle').forEach(t => t.addEventListener('click', () => t.closest('.nav-item').classList.toggle('open')));
            document.querySelectorAll('.nav-item.active').forEach(li => li.classList.add('open'));
            document.getElementById('avatarBtn')?.addEventListener('click', e => {
                e.stopPropagation();
                document.getElementById('profileMenu').classList.toggle('show');
                document.getElementById('profileBackdrop').classList.toggle('show');
            });
            document.getElementById('profileBackdrop')?.addEventListener('click', () => {
                document.getElementById('profileMenu').classList.remove('show');
                document.getElementById('profileBackdrop').classList.remove('show');
            });
        });

        let isDirty = false;
        window.isDirty = false;
        function markDirty() {
            isDirty = true;
            window.isDirty = true;
            document.getElementById('savebar')?.classList.add('visible');
            if (typeof feather !== 'undefined') feather.replace();
        }
        window.markDirty = markDirty;

        function cancelHours() {
            if (typeof window.cancelHours === 'function') {
                window.cancelHours();
            } else {
                isDirty = false;
                window.isDirty = false;
                document.getElementById('savebar')?.classList.remove('visible');
            }
        }
        window.cancelHours = cancelHours;

        window.addEventListener('beforeunload', e => { if (isDirty) { e.preventDefault(); e.returnValue = ''; } });

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toastNotification');
            if (!t) return;
            t.textContent = msg;
            t.style.background = type === 'error' ? '#dc2626' : '#1e293b';
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 3500);
        }
        window.showToast = showToast;
    </script>
</body>
</html>
